name: Sprout Codex
on:
  push:
    paths: ['mods/sprout-codex/**', 'mods/sprout/hooks/**', 'mods/sprout/types/**', '.github/workflows/sprout-codex.yml']
  pull_request:
    paths: ['mods/sprout-codex/**', 'mods/sprout/hooks/**', 'mods/sprout/types/**', '.github/workflows/sprout-codex.yml']
jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.16.0', '24']
    defaults:
      run:
        working-directory: mods/sprout-codex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mods/sprout-codex/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Check committed bundles
        run: git diff --exit-code -- dist
      - run: npm test
