name: Sprout Codex
on:
  push:
    paths: ['mods/sprout-codex/**', '.github/workflows/sprout-codex.yml']
  pull_request:
    paths: ['mods/sprout-codex/**', '.github/workflows/sprout-codex.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mods/sprout-codex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mods/sprout-codex/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
